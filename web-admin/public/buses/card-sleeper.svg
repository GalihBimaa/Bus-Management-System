    <stop offset="0%" stop-color="#065f46"/>
    <stop offset="60%" stop-color="#a7f3d0"/>
    <stop offset="100%" stop-color="#f1f5f9"/>
  </linearGradient>
  <rect width="400" height="175" fill="url(#sky1)"/>
